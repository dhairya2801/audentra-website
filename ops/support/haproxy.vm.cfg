# Loopback-only ingress for the self-hosted VM burst test.
global
    maxconn 16000
    nbthread 2

defaults
    mode http
    timeout connect 5s
    timeout client 90s
    timeout server 90s
    timeout queue 90s
    retries 0

frontend vm_ingress
    bind 127.0.0.1:4371 shards by-thread
    backlog 4096
    default_backend website

backend website
    server next 127.0.0.1:4373 maxconn 224
